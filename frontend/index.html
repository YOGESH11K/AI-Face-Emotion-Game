<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Face Emotion - Stem Emotion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; color: #fff;
  }
  .card {
    max-width: 560px; margin: 6vh auto; background: rgba(255,255,255,.08);
    backdrop-filter: blur(8px); border-radius: 20px; padding: 2.2rem;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  h1 { font-size: 1.9rem; margin-bottom: .3rem; }
  p.sub { opacity: .85; margin-bottom: 1.6rem; }
  #drop {
    border: 2px dashed rgba(255,255,255,.55); border-radius: 14px;
    padding: 2rem; cursor: pointer; margin-bottom: 1.2rem;
    transition: .2s; background: rgba(0,0,0,.15);
  }
  #drop:hover, #drop.over { border-color: #fff; background: rgba(0,0,0,.3); }
  #preview { max-width: 100%; max-height: 260px; border-radius: 12px; display: none; margin-top: 1rem; }
  #btn {
    background: #fff; color: #764ba2; border: none; border-radius: 12px;
    font-weight: 700; font-size: 1.05rem; padding: .85rem 2rem; cursor: pointer;
    transition: .15s; display: none; width: 100%;
  }
  #btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  #result { margin-top: 1.4rem; display: none; }
  #emoji { font-size: 4.5rem; }
  #label { font-size: 1.6rem; font-weight: 700; text-transform: capitalize; }
  #conf { opacity: .85; }
  #bars { margin-top: 1rem; text-align: left; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 50px; gap: 8px; align-items: center; margin: 4px 0; }
  .bar-track { background: rgba(255,255,255,.15); border-radius: 6px; height: 12px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg,#f093fb,#f5576c); border-radius: 6px; transition: width .5s; }
  #err { color: #ffd6d6; margin-top: 1rem; display: none; font-size: .95rem; }
  footer { text-align: center; opacity: .65; font-size: .8rem; margin-top: 2rem; }
  .spinner { display: none; margin: 1rem auto; width: 32px; height: 32px; border: 4px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>🎭 AI Face Emotion</h1>
  <p class="sub">Upload a clear face photo and the AI (eNet-B0 / AffectNet) reads the emotion.</p>
  <div id="app">
    <div id="drop">
      <div>📷 Click or drag a photo here</div>
      <input type="file" id="file" accept="image/*" style="display:none">
    </div>
    <img id="preview" alt="preview">
    <button id="btn">🔍 Analyze Emotion</button>
    <div class="spinner" id="spinner"></div>
    <div id="result">
      <div id="emoji">😐</div>
      <div id="label">Neutral</div>
      <div id="conf"></div>
      <div id="bars"></div>
    </div>
    <div id="err"></div>
  </div>
  <footer>Powered by DeepTrust • Streamlit game runs locally at home</footer>
</div>
<script>
const API = "https://emotion-detection-api.onrender.com/predict";
const EMOJI = { angry: "😠", disgust: "🤢", fear: "😨", happy: "😄", sad: "😢", surprise: "😲", neutral: "😐" };
const drop = document.getElementById("drop");
const file = document.getElementById("file");
const preview = document.getElementById("preview");
const btn = document.getElementById("btn");
const result = document.getElementById("result");
const bars = document.getElementById("bars");
const err = document.getElementById("err");

drop.onclick = () => file.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); };
file.onchange = () => handle(file.files[0]);

function handle(f) {
  if (!f || !f.type.startsWith("image/")) return;
  preview.src = URL.createObjectURL(f);
  preview.style.display = "block";
  btn.style.display = "block";
  result.style.display = "none";
  err.style.display = "none";
}

btn.onclick = async () => {
  if (!file.files[0]) return;
  btn.style.display = "none";
  err.style.display = "none";
  const spin = document.getElementById("spinner");
  spin.style.display = "block";
  const fd = new FormData();
  fd.append("file", file.files[0]);
  try {
    const res = await fetch(API, { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok || data.status !== "success") {
      showErr(data.detail || ("Status: " + (data.status || res.status)));
      return;
    }
    document.getElementById("emoji").textContent = EMOJI[data.emotion] || "🎭";
    document.getElementById("label").textContent = data.emotion;
    document.getElementById("conf").textContent = "Confidence " + data.confidence + "%";
    bars.innerHTML = Object.entries(data.emotions)
      .map(([k, v]) => `<div class="bar-row"><span>${k}</span><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div><span>${v}%</span></div>`)
      .join("");
    result.style.display = "block";
  } catch (ex) {
    showErr("Could not reach the backend. Is the Render service running?");
  } finally {
    spin.style.display = "none";
  }
};

function showErr(m) {
  err.textContent = "⚠️ " + m;
  err.style.display = "block";
  result.style.display = "none";
  btn.style.display = "block";
}
</script>
</body>
</html>
